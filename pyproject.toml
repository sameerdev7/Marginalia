[project]
name = "athenaeum"
version = "0.1.0"
description = "A social network for readers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "httpx",
    "livekit-api>=1.2.1",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
